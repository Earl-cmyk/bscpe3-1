{% extends "base.html" %}
{% block title %}Notes | R3-1NFORCE{% endblock %}
{% block content %}
<main class="workspace-page">
    <div class="page-actions">
      <select id="courseFilter" class="button button-quiet">
        <option value="">All Courses</option>
        <option>HDL</option>
        <option>LCD</option>
        <option>DDC</option>
        <option>CEDD</option>
        <option>FOSS</option>
        <option>TRW</option>
        <option>Elec</option>
        <option>Engr Econ</option>
      </select>
      <button id="openNote" class="button button-primary icon-action" aria-label="Add post" title="Add post">+</button>
    </div>
  <section id="notesFeed" class="announcement-history"><p class="muted">Loading notes...</p></section>
</main>
<div id="pinModal" class="modal-backdrop" hidden><form id="pinForm" class="modal small-modal"><button type="button" class="close" data-close="pinModal" aria-label="Close">&times;</button><p class="eyebrow">PRIVATE POST</p><h2>Enter your PIN</h2><input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" required /><p id="pinError" class="form-error" hidden></p><button class="button button-primary full-button icon-action" type="submit" aria-label="Continue">&rarr;</button></form></div>
<div id="noteModal" class="modal-backdrop" hidden><form class="modal announcement-form" id="noteForm" enctype="multipart/form-data"><button type="button" class="close" data-close="noteModal" aria-label="Close">&times;</button><p class="eyebrow">NEW NOTE</p><h2>Post a note</h2><input type="hidden" name="pin" value=""><div class="form-grid single"><label>Title<input name="title" maxlength="120" required /></label><label>Course<select name="course" required><option value="">Select course</option><option>HDL</option><option>LCD</option><option>DDC</option><option>CEDD</option><option>FOSS</option><option>TRW</option><option>Elec</option><option>Engr Econ</option></select></label><label class="full">Caption<textarea name="caption" maxlength="2000" rows="5" required></textarea></label><label>Files<input name="attachments" type="file" accept="image/*,video/*,.pdf,.doc,.docx,.txt" multiple /></label></div><p id="noteError" class="form-error" hidden></p><button class="button button-primary full-button" type="submit">Post note</button></form></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/notes.js') }}"></script>{% endblock %}
