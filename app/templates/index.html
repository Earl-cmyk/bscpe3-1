{% extends "base.html" %}
{% block title %}Home | R3-1NFORCE{% endblock %}
{% block content %}
<main class="dashboard">
  <div class="dashboard-actions">
    <button id="openAnnouncement" class="button button-primary icon-action" aria-label="Post announcement" title="Post announcement">+</button>
  </div>
  <section class="dashboard-grid">
    <article class="dashboard-card announcement-feed"><div class="card-heading"><h2>Announcements</h2><a href="{{ url_for('main.announcements_page') }}" class="text-link icon-action" aria-label="Announcement history" title="Announcement history">&#128337;</a></div><div id="announcementFeed" class="announcement-list"><p class="muted">Loading announcements...</p></div></article>
    <article class="dashboard-card balance-card"><strong id="dashboardBalance">0.00</strong><a href="{{ url_for('main.budget_page') }}" class="button button-quiet icon-action" aria-label="Open class fund" title="Open class fund">&nearr;</a></article>
    <article class="dashboard-card deadline-card"><div class="card-heading"><span class="section-symbol" title="Upcoming deadlines">&star;</span><a href="{{ url_for('main.tasks_page') }}" class="text-link icon-action" aria-label="Open calendar" title="Open calendar">&nearr;</a></div><div id="upcomingDeadlines" class="deadline-list"><p class="muted">Loading...</p></div></article>
  </section>
</main>
<div id="pinModal" class="modal-backdrop" hidden><form id="pinForm" class="modal small-modal"><button type="button" class="close" data-close="pinModal" aria-label="Close">&times;</button><p class="eyebrow">PRIVATE POST</p><h2>Enter your PIN</h2><input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" required /><p id="pinError" class="form-error" hidden></p><button class="button button-primary full-button" type="submit">Continue</button></form></div>
<div id="announcementModal" class="modal-backdrop" hidden><form id="announcementForm" class="modal announcement-form" enctype="multipart/form-data"><button type="button" class="close" data-close="announcementModal" aria-label="Close">&times;</button><p class="eyebrow">NEW NOTICE</p><h2>Post an announcement</h2><input type="hidden" name="pin" value=""><div class="form-grid single"><label>Title<input name="title" maxlength="120" required /></label><label>Message<textarea name="body" maxlength="2000" required hidden></textarea><div class="rich-toolbar" role="toolbar" aria-label="Message formatting"><button type="button" data-command="bold" aria-label="Bold" title="Bold"><strong>B</strong></button><button type="button" data-command="italic" aria-label="Italic" title="Italic"><em>I</em></button><button type="button" data-command="underline" aria-label="Underline" title="Underline"><u>U</u></button><button type="button" data-command="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list">&#8226;</button><button type="button" data-command="insertOrderedList" aria-label="Numbered list" title="Numbered list">1.</button><button type="button" data-link aria-label="Insert hyperlink" title="Insert hyperlink">&#128279;</button><button type="button" data-command="foreColor" data-value="#b42318" aria-label="Red text" title="Red text">A</button><button type="button" data-command="foreColor" data-value="#176b87" aria-label="Blue text" title="Blue text">A</button><button type="button" data-command="hiliteColor" data-value="#fff0a8" aria-label="Yellow highlight" title="Yellow highlight">&#9632;</button><span class="emoji-tools" aria-label="Emoji"><button type="button" data-emoji="😀" title="Add smile emoji">😀</button><button type="button" data-emoji="🎉" title="Add celebration emoji">🎉</button><button type="button" data-emoji="❤️" title="Add heart emoji">❤️</button></span></div><div id="announcementEditor" class="rich-editor" data-rich-editor data-input="#announcementForm textarea[name='body']" contenteditable="true" role="textbox" aria-label="Message" aria-multiline="true"></div></label><label>Optional link<input name="link_url" type="url" placeholder="https://..." /></label><label>Optional file<input name="attachment" type="file" accept="image/*,.pdf,.doc,.docx,.txt" /></label></div><button id="pollToggle" type="button" class="poll-toggle" aria-expanded="false"><span>Add poll options</span><strong>&rarr;</strong></button><div id="pollFields" class="poll-fields" hidden><label>Option 1<input name="options" maxlength="80" /></label><label>Option 2<input name="options" maxlength="80" /></label><label>Option 3<input name="options" maxlength="80" /></label></div><p id="announcementError" class="form-error" hidden></p><button class="button button-primary full-button" type="submit">Publish announcement</button></form></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/rich-text.js') }}"></script><script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>{% endblock %}
