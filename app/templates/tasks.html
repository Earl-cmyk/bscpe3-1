{% extends "base.html" %}
{% block title %}Tasks | R3-1NFORCE{% endblock %}
{% block content %}
<main class="workspace-page"><div class="page-heading"><div><p class="eyebrow">DEADLINES</p></div><button id="openTask" class="button button-primary icon-action" aria-label="Add task" title="Add task">+</button></div><section class="calendar-panel"><div class="calendar-toolbar"><h2 id="calendarTitle"></h2><div class="calendar-controls"><button id="previousMonth" class="icon-button" aria-label="Previous month">&larr;</button><button id="todayButton" class="button button-quiet icon-action" aria-label="Today" title="Today">&#9673;</button><button id="nextMonth" class="icon-button" aria-label="Next month">&rarr;</button></div></div><div id="calendar" class="calendar"></div></section></main>
<div id="pinModal" class="modal-backdrop" hidden><form id="pinForm" class="modal small-modal"><button type="button" class="close" data-close="pinModal" aria-label="Close">&times;</button><p class="eyebrow">PRIVATE ENTRY</p><h2>Enter your PIN</h2><input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" required /><p id="pinError" class="form-error" hidden></p><button class="button button-primary full-button icon-action" type="submit" aria-label="Continue">&rarr;</button></form></div>
<div id="taskFormModal" class="modal-backdrop" hidden><form id="taskForm" class="modal task-form" enctype="multipart/form-data"><button type="button" class="close" data-close="taskFormModal" aria-label="Close">&times;</button><p class="eyebrow">NEW ENTRY</p><h2>Add a task</h2><div class="form-grid"><label>Title<input name="title" required maxlength="120" /></label><label>Course<select name="course" required><option value="">Select course</option><option>HDL</option><option>LCD</option><option>DDC</option><option>CEDD</option><option>FOSS</option><option>TRW</option><option>Elec</option><option>Engr Econ</option></select></label><label class="full">Description<textarea name="description" required maxlength="1000" rows="3"></textarea></label><label>Deadline<input name="deadline" type="datetime-local" required /></label><label>Difficulty<select name="difficulty"><option>Low</option><option selected>Medium</option><option>High</option></select></label></div><p id="taskError" class="form-error" hidden></p><button class="button button-primary full-button icon-action" type="submit" aria-label="Save task">&check;</button></form></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/tasks.js') }}"></script>{% endblock %}
