{% extends "base.html" %}
{% block title %}Tasks | R3-1NFORCE{% endblock %}
{% block content %}
<main class="workspace-page"><div class="page-actions"><button id="openTask" class="button button-primary" aria-label="Add task" title="Add task">+ Add task</button><button id="openNoClass" class="button button-quiet" type="button">No classes</button></div><section class="calendar-panel"><div class="calendar-toolbar"><h2 id="calendarTitle"></h2><div class="calendar-controls"><button id="previousMonth" class="icon-button" aria-label="Previous period">&larr;</button><button id="todayButton" class="button button-quiet" aria-label="Today" title="Today">Today</button><button id="nextMonth" class="icon-button" aria-label="Next period">&rarr;</button><div class="view-switcher" role="group" aria-label="Calendar view"><button type="button" data-view="month">Month</button><button type="button" data-view="week">Week</button><button type="button" data-view="day">Day</button></div></div></div><div id="calendar" class="calendar"></div></section></main>
<div id="pinModal" class="modal-backdrop" hidden><form id="pinForm" class="modal small-modal"><button type="button" class="close" data-close="pinModal" aria-label="Close">&times;</button><p class="eyebrow">PRIVATE ENTRY</p><h2>Enter your PIN</h2><input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" required /><p id="pinError" class="form-error" hidden></p><button class="button button-primary full-button icon-action" type="submit" aria-label="Continue">&rarr;</button></form></div>
<div id="noClassModal" class="modal-backdrop" hidden><form id="noClassForm" class="modal small-modal"><button type="button" class="close" data-close="noClassModal" aria-label="Close">&times;</button><p class="eyebrow">SCHEDULE EXCEPTION</p><h2>No classes</h2><label>Date<input id="noClassDate" name="date" type="date" required /></label><label>Course<select id="noClassCourse" name="course" required></select></label><p id="noClassError" class="form-error" hidden></p><button class="button button-primary full-button" type="submit">Mark no class</button><div id="exceptionList" class="exception-list"></div></form></div>
<div id="taskFormModal" class="modal-backdrop" hidden><form id="taskForm" class="modal task-form" enctype="multipart/form-data"><button type="button" class="close" data-close="taskFormModal" aria-label="Close">&times;</button><p id="taskFormEyebrow" class="eyebrow">NEW ENTRY</p><h2 id="taskFormTitle">Add a task</h2><div class="form-grid"><label>Title<input name="title" required maxlength="120" /></label><label>Course<select name="course" required><option value="">Select course</option><option>HDL</option><option>LCD</option><option>DDC</option><option>CEDD</option><option>FOSS</option><option>TRW</option><option>Elec</option><option>Engr Econ</option><option>Other</option></select></label><label class="full">Description<textarea name="description" required maxlength="2000" rows="3" hidden></textarea><div class="rich-toolbar" role="toolbar" aria-label="Description formatting"><button type="button" data-command="bold" aria-label="Bold" title="Bold"><strong>B</strong></button><button type="button" data-command="italic" aria-label="Italic" title="Italic"><em>I</em></button><button type="button" data-command="underline" aria-label="Underline" title="Underline"><u>U</u></button><button type="button" data-command="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list">&bull;</button><button type="button" data-command="insertOrderedList" aria-label="Numbered list" title="Numbered list">1.</button></div><div id="taskDescriptionEditor" class="rich-editor" data-rich-editor data-input="#taskForm textarea[name='description']" contenteditable="true" role="textbox" aria-label="Description editor"></div></label><label>Deadline<input name="deadline" type="datetime-local" required /></label><label>Difficulty<select name="difficulty"><option>Low</option><option selected>Medium</option><option>High</option></select></label></div><p id="taskError" class="form-error" hidden></p><button class="button button-primary full-button" type="submit">Save task</button></form></div>
<div id="taskModal" class="modal-backdrop" hidden><article class="modal task-detail"><button type="button" class="close" data-close="taskModal" aria-label="Close">&times;</button><div id="taskModalContent"></div><div class="modal-actions"><button id="editTask" class="button button-primary" type="button">Edit</button><button id="deleteTask" class="button button-danger" type="button">Delete</button></div></article></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/rich-text.js') }}"></script><script src="{{ url_for('static', filename='js/tasks.js') }}"></script>{% endblock %}
