<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}R3-1NFORCE{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="brand" href="{{ url_for('main.index') }}"><span class="brand-mark">3-1</span><span>R3-1NFORCE</span></a>
        <div class="nav-actions">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('main.index') }}" aria-label="Home" title="Home">🏠</a>
          <a class="nav-link {% if request.path == '/tasks' %}active{% endif %}" href="{{ url_for('main.tasks_page') }}" aria-label="Tasks" title="Tasks">📋</a>
          <a class="nav-link {% if request.path == '/notes' %}active{% endif %}" href="{{ url_for('main.notes_page') }}" aria-label="Notes" title="Notes">📓</a>
          <a class="nav-link {% if request.path == '/budget' %}active{% endif %}" href="{{ url_for('main.budget_page') }}" aria-label="Class fund" title="Class fund">💰</a>
          <div class="global-search">
            <form id="globalSearchForm" role="search" autocomplete="off">
              <span aria-hidden="true">&#128269;</span>
              <input id="globalSearchInput" type="search" placeholder="Search notes, announcements, deadlines" autocomplete="off" aria-label="Search notes, announcements, and deadlines" aria-controls="globalSearchResults" aria-expanded="false" />
            </form>
            <div id="globalSearchResults" class="global-search-results" hidden role="dialog" aria-label="Search results"><div class="search-tools"><span>Search results</span><button id="closeSearch" class="close" type="button" aria-label="Close search results">&times;</button></div><div class="search-filters" role="group" aria-label="Filter search results"><button type="button" class="search-chip active" data-search-kind="">All</button><button type="button" class="search-chip" data-search-kind="Note">Notes</button><button type="button" class="search-chip" data-search-kind="Announcement">Announcements</button><button type="button" class="search-chip" data-search-kind="Task">Deadlines</button></div><div id="searchResultList"></div></div>
          </div>
        </div>
      </div>
    </nav>
    <div class="shell">
      {% block content %}{% endblock %}
      <section id="mediaModal" class="modal-backdrop" hidden aria-labelledby="mediaModalTitle" role="dialog" aria-modal="true">
        <div class="modal media-modal">
          <button class="close" type="button" data-close="mediaModal" aria-label="Close media viewer" title="Close media viewer">&times;</button>
          <h2 id="mediaModalTitle">Attachment preview</h2>
          <div id="mediaModalContent" class="media-modal-content"></div>
          <div class="media-modal-footer">
            <span id="mediaModalName" class="muted"></span>
            <a id="mediaModalDownload" class="button button-quiet" href="#" download>Download</a>
          </div>
        </div>
      </section>
      <section id="chatHistory" class="chat-history" aria-live="polite" hidden><button id="closeChat" class="close chat-close" type="button" aria-label="Close conversation" title="Close conversation">&times;</button><div id="chatMessages"></div></section>
      <footer class="chat-bar">
        <span class="chat-orb">?</span>
        <form id="queryForm">
          <input id="queryInput" placeholder="What's up?" aria-label="Planner query" />
          <button class="chat-submit" type="submit" aria-label="Send planner query" title="Send planner query">&uarr;</button>
        </form>
      </footer>
    </div>
    <script src="{{ url_for('static', filename='js/planner.js') }}"></script>
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
    <script src="{{ url_for('static', filename='js/media-viewer.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
