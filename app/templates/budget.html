{% extends "base.html" %}
{% block title %}Class Fund | R3-1NFORCE{% endblock %}
{% block content %}
<main class="workspace-page"><button id="openAudit" class="button button-primary icon-action" aria-label="Record movement" title="Record movement">+</button><section class="budget-panel"><div class="budget-heading"><div><p class="eyebrow">CURRENT BALANCE</p><h2 id="balanceValue">0.00</h2></div><div id="entryCount" class="muted">0 entries</div></div><div class="budget-grid"><div class="pie-wrap"><div id="budgetPie" class="budget-pie"><svg viewBox="0 0 42 42" role="img" aria-label="Budget breakdown"><circle class="pie-track" cx="21" cy="21" r="15.9"></circle><circle id="pieDeposit" class="pie-segment deposit" cx="21" cy="21" r="15.9"></circle><circle id="pieWithdraw" class="pie-segment withdraw" cx="21" cy="21" r="15.9"></circle></svg><span id="pieLabel">No entries</span></div><div class="legend"><span><i class="legend-deposit"></i>Deposits</span><span><i class="legend-withdraw"></i>Withdrawals</span></div></div><div id="budgetEntries" class="budget-entries"></div></div></section></main>
<div id="pinModal" class="modal-backdrop" hidden><form id="pinForm" class="modal small-modal"><button type="button" class="close" data-close="pinModal" aria-label="Close">&times;</button><p class="eyebrow">PRIVATE ENTRY</p><h2>Enter your PIN</h2><input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" required /><p id="pinError" class="form-error" hidden></p><button class="button button-primary full-button icon-action" type="submit" aria-label="Continue">&rarr;</button></form></div>
<div id="auditModal" class="modal-backdrop" hidden><form id="auditForm" class="modal small-modal"><button type="button" class="close" data-close="auditModal" aria-label="Close">&times;</button><p class="eyebrow">BUDGET AUDIT</p><h2>Record movement</h2><div class="form-grid single"><label>Action<select name="type"><option value="deposit">Deposit</option><option value="withdraw">Withdraw</option></select></label><label>Amount<input name="amount" type="number" min="0.01" step="0.01" required /></label><label>Reason<textarea name="reason" required maxlength="240" rows="3"></textarea></label></div><p id="auditError" class="form-error" hidden></p><button class="button button-primary full-button icon-action" type="submit" aria-label="Save audit">&check;</button></form></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/budget.js') }}"></script>{% endblock %}
